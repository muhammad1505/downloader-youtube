name: Android tests

# Workflow ini hanya menguji: unit test, lint rilis, tes host Python, dan
# verifikasi aset engine. Build APK rilis, audit paket, dan publikasi berada
# di release-apk.yml agar pekerjaan rilis tidak dijalankan berulang di sini.
on:
  push:
    # Tag rilis sengaja tidak memicu workflow ini; release-apk.yml yang menanganinya.
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit, lint, and host tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
      - name: Install Android and native build tools
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"
      - name: Rebuild compatible FFmpeg payload
        run: bash scripts/rebuild_ffmpeg_webp.sh
      - name: Verify bundled engine manifest and checksum
        run: python3 scripts/verify_engine_asset.py
      - uses: gradle/actions/setup-gradle@v4
      # Tanpa assembleRelease: APK rilis hanya dibangun sekali di release-apk.yml.
      # Lint tetap di sini agar masalah rilis tertangkap sebelum tag dibuat.
      - name: Unit tests and release lint
        run: ./gradlew testDebugUnitTest lintRelease --no-daemon
      # Tes host memakai binary ffmpeg/ffprobe sungguhan (kompresi sampul dan
      # pemrosesan opsional). Tanpa ini runner melewati 5 tes dan satu tes gagal.
      - name: Install host media tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python3 -m unittest discover -s scripts -p "test_*.py"
      # Ringkasan angka tes ditulis ke halaman run, jadi hasilnya tetap terbaca
      # tanpa menyimpan artifact apa pun.
      - name: Publish unit-test summary
        if: always()
        run: python3 scripts/ci_summary.py
