name: Android checks
on:
  push:
    # Tag rilis ditangani release-apk.yml agar job pemeriksaan tidak berjalan ganda.
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
      - name: Install Android and native build tools
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"
      - name: Rebuild compatible FFmpeg payload
        run: bash scripts/rebuild_ffmpeg_webp.sh
      - name: Verify bundled engine manifest and checksum
        run: python3 scripts/verify_engine_asset.py
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest lintDebug lintRelease assembleDebug assembleRelease --no-daemon
      # Tes host memakai binary ffmpeg/ffprobe sungguhan (kompresi sampul dan
      # pemrosesan opsional). Tanpa ini runner melewati 5 tes dan satu tes gagal.
      - name: Install host media tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python3 -m unittest discover -s scripts -p "test_*.py"
      - name: Audit native 16 KB compatibility
        run: |
          for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            python3 scripts/audit_native.py "$apk"
          done
      - name: Audit optimized reflective ZIP constructors
        run: |
          for apk in app/build/outputs/apk/release/*.apk; do
            python3 scripts/audit_release_zip_fields.py "$apk"
          done
      # Ringkasan angka tes ditulis ke halaman run, jadi hasilnya tetap terbaca
      # walau unggahan artifact ditolak kuota penyimpanan akun.
      - name: Publish unit-test summary
        if: always()
        run: python3 scripts/ci_summary.py
      # Laporan teks saja (bukan APK debug ~70 MB) agar tidak menghabiskan kuota
      # penyimpanan artifact akun. Kegagalan kuota bukan bagian dari gate
      # kebenaran: tes, lint, dan audit di atas tetap menentukan hasil job.
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: android-reports
          retention-days: 7
          path: |
            app/build/reports/
            app/build/test-results/
